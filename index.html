<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PolyGlot · 沉浸式多语种学习平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Top Navigation -->
  <header class="topbar" id="topbar">
    <div class="brand" data-route="home">
      <span class="brand-logo">🌍</span>
      <span class="brand-name">PolyGlot</span>
    </div>
    <nav class="navlinks" id="navlinks">
      <a data-route="home">首页</a>
      <a data-route="courses">课程</a>
      <a data-route="learning">学习中心</a>
      <a data-route="progress">学习进度</a>
      <a data-route="path">个性推荐</a>
      <a data-route="community">社区</a>
    </nav>
    <div class="auth-area" id="authArea"></div>
  </header>

  <!-- Main view container -->
  <main id="view" class="view-container"></main>

  <!-- Toast notifications -->
  <div id="toast" class="toast"></div>

  <!-- Auth Modal -->
  <div class="modal" id="authModal">
    <div class="modal-card">
      <button class="modal-close" data-close>×</button>
      <div class="tabs" id="authTabs">
        <button class="tab active" data-auth-tab="login">登录</button>
        <button class="tab" data-auth-tab="register">注册</button>
      </div>
      <form id="authForm" class="auth-form">
        <div class="reg-extra" id="regExtra" hidden>
          <label>昵称
            <input type="text" name="nickname" placeholder="给自己起个昵称" autocomplete="off" />
          </label>
          <label>母语
            <select name="native">
              <option value="zh">中文</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
            </select>
          </label>
          <label>目标语言
            <select name="target">
              <option value="en">英语 English</option>
              <option value="ja">日语 日本語</option>
              <option value="ko">韩语 한국어</option>
            </select>
          </label>
          <label>当前水平
            <select name="level">
              <option value="A1">A1 入门</option>
              <option value="A2">A2 初级</option>
              <option value="B1">B1 中级</option>
              <option value="B2">B2 中高级</option>
              <option value="C1">C1 高级</option>
              <option value="C2">C2 精通</option>
            </select>
          </label>
        </div>
        <label>账号
          <input type="text" name="username" placeholder="用户名 / 邮箱" autocomplete="off" required />
        </label>
        <label>密码
          <input type="password" name="password" placeholder="至少 6 位" required />
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="authSubmit">登录</button>
        <p class="auth-hint" id="authHint"></p>
      </form>
    </div>
  </div>

  <footer class="footer">
    <p>PolyGlot · 沉浸式多语种学习平台 · 英语 / 日语 / 韩语</p>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/learning.js"></script>
  <script src="js/courses.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/path.js"></script>
  <script src="js/community.js"></script>
  <script src="js/home.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
